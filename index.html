<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Enterprise Resource Planning system with L0-L4 shell, 41 business modules, 30 workspaces, Service Worker offline synchronization & request replay queue, Business Guidance Layer, and authoritative inventory & costing cores." />
    <meta property="og:title" content="NexusSync ERP" />
    <meta property="og:description" content="Enterprise Resource Planning system with L0-L4 shell, 41 business modules, 30 workspaces, Service Worker offline synchronization & request replay queue, Business Guidance Layer, and authoritative inventory & costing cores." />
    <title>NexusSync ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // 1. Safe storage polyfill for iframe sandboxes or restricted browser privacy modes
        function testStorage(type) {
          try {
            var s = window[type];
            if (!s) return false;
            var k = '__test_' + Math.random();
            s.setItem(k, '1');
            s.removeItem(k);
            return true;
          } catch (e) {
            return false;
          }
        }
        function createMemoryStore() {
          var store = {};
          return {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          };
        }
        if (!testStorage('localStorage')) {
          try {
            var memLocal = createMemoryStore();
            Object.defineProperty(window, 'localStorage', { value: memLocal, configurable: true, writable: true });
          } catch(e) {}
        }
        if (!testStorage('sessionStorage')) {
          try {
            var memSession = createMemoryStore();
            Object.defineProperty(window, 'sessionStorage', { value: memSession, configurable: true, writable: true });
          } catch(e) {}
        }

        // 2. Clear any lingering Service Workers in development to prevent interception
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister().catch(function() {});
            }
          }).catch(function() {});
        }

        // 3. Failsafe loader dismisser
        function dismissLoader() {
          var loader = document.getElementById('app-bootstrap-loader');
          if (loader) {
            loader.style.transition = 'opacity 0.35s ease-out, visibility 0.35s';
            loader.style.opacity = '0';
            loader.style.pointerEvents = 'none';
            setTimeout(function() {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 350);
          }
        }
        window.__dismissNexusBootstrapLoader = dismissLoader;

        // Auto-dismiss when React attaches or after failsafe timeout (max 2.5s)
        window.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root && window.MutationObserver) {
            var obs = new MutationObserver(function() {
              if (root.children.length > 0) {
                dismissLoader();
                obs.disconnect();
              }
            });
            obs.observe(root, { childList: true });
          }
          setTimeout(dismissLoader, 2500);
        });
      })();
    </script>
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased font-sans selection:bg-blue-600 selection:text-white">
    <!-- Main React Mount Root -->
    <div id="root"></div>

    <!-- Standalone Bootstrap Overlay Loader (Auto-dismissed upon React mount) -->
    <div id="app-bootstrap-loader" style="position: fixed; inset: 0; z-index: 99999; background-color: #0b1329; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #94a3b8; padding: 24px;">
      <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #1d4ed8); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);">
          <svg style="width: 24px; height: 24px; color: white;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div>
          <div style="font-size: 20px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em;">NexusSync ERP</div>
          <div style="font-size: 11px; font-weight: 500; color: #64748b; font-family: monospace;">ENTERPRISE OPERATING SYSTEM • L0-L4</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #cbd5e1; background: rgba(30, 41, 59, 0.7); padding: 8px 18px; border-radius: 9999px; border: 1px solid rgba(51, 65, 85, 0.6);">
        <div style="width: 14px; height: 14px; border: 2px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: nexusSpin 0.75s linear infinite;"></div>
        <span id="app-bootstrap-status">Đang khởi tạo các phân hệ & dữ liệu doanh nghiệp...</span>
      </div>
      <style>
        @keyframes nexusSpin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
