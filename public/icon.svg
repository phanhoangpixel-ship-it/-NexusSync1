<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nexus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#nexus-grad)" />

  <!-- Inner Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.4" />

  <!-- Enterprise Layers / Sync Emblem -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Bottom Plate -->
    <path d="M150 190 L260 240 L150 290 L40 240 Z" fill="#93c5fd" opacity="0.8" />
    <!-- Middle Plate -->
    <path d="M150 130 L260 180 L150 230 L40 180 Z" fill="#bfdbfe" opacity="0.9" />
    <!-- Top Plate -->
    <path d="M150 70 L260 120 L150 170 L40 120 Z" fill="#ffffff" />
    
    <!-- Sync arrows or Nexus Node Accent -->
    <circle cx="150" cy="120" r="14" fill="#2563eb" />
  </g>

  <!-- Brand Typography Sub-badge -->
  <rect x="176" y="416" width="160" height="32" rx="16" fill="#1e3a8a" opacity="0.9" />
  <text x="256" y="438" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">NEXUS SYNC</text>
</svg>
